<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Riddle Library</title><link rel="stylesheet" href="style.css"></head>
<body><header><a href="./" class="brand">RL<span id="brand"></span></a><div class="tools"><label for="language" id="languageLabel"></label><select id="language"><option value="en">English</option><option value="de">Deutsch</option></select></div></header>
<main><section class="intro"><div><h1 id="title"></h1><p id="intro"></p></div><div class="status"><span id="progress"></span><div class="track"><div id="bar"></div></div><small id="stats"></small></div></section>
<div class="layout"><aside><h2 id="explore"></h2><nav id="objects" aria-label="Objects"></nav><div class="note"><span id="noteTitle"></span><p id="note"></p></div></aside>
<section class="puzzle" aria-labelledby="objectTitle"><div class="chapter" id="chapter"></div><h2 id="objectTitle"></h2><p id="description"></p><div id="riddleArea"><blockquote id="question"></blockquote><form id="answerForm"><label for="answer" id="answerLabel"></label><div class="inputRow"><input id="answer" autocomplete="off" maxlength="150" required><button class="primary" id="submit"></button></div></form><div class="hintRow"><button id="hintButton" type="button"></button><small id="hintCount"></small></div><ol id="hints"></ol></div><div id="clockArea" hidden></div><form id="exitForm" hidden><label for="code" id="codeLabel"></label><div class="inputRow"><input id="code" inputmode="numeric" maxlength="3" pattern="[0-9]{3}" required><button class="primary" id="unlock"></button></div></form><p id="feedback" role="status" aria-live="polite"></p></section>
<aside class="inventory"><h2 id="codeTitle"></h2><p id="codeHelp"></p><div id="digits"></div><p id="order"></p><div id="victory" hidden><h2 id="victoryTitle"></h2><p id="victoryText"></p></div></aside></div>
<footer><span id="offline"></span><div><button id="save"></button><button id="load"></button><button id="restart"></button><input type="file" id="file" accept="application/json,.json" hidden></div></footer></main><script src="engine.js"></script><script src="ui.js"></script></body></html>
